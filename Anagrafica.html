<!DOCTYPE html>
<head>
  <title>Anagrafica 1.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #e6e6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    p.subtitle {
      color: #888888;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaaaaa;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input {
      background: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    input::placeholder {
      color: #555555;
    }

    input:focus {
      border-color: #ffffff;
      background: #252525;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    button {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 0.9rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 2.5rem;
    }

    button:hover {
      background: #cccccc;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .table-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #ffffff;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 0.5rem;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #1a1a1a;
      color: #888888;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #2a2a2a;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid #222222;
      font-size: 0.95rem;
      color: #dddddd;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: #1c1c1c;
    }

    tbody:empty::after {
      content: "Nessun dato inserito nella tabella";
      display: block;
      padding: 1.5rem;
      color: #444444;
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Anagrafica 1.0</h2>

    <div class="form-grid">
      <div class="input-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Alexandru">
      </div>
      <div class="input-group">
        <label for="cognome">Cognome</label>
        <input type="text" id="cognome" placeholder="Mihalache">
      </div>
      <div class="input-group">
        <label for="indirizzo">Indirizzo</label>
        <input type="text" id="indirizzo" placeholder="Via Massacciuccioli 48">
      </div>
      <div class="input-group">
        <label for="citta">Città</label>
        <input type="text" id="citta" placeholder="Roma">
      </div>
      <div class="input-group">
        <label for="eta">Età</label>
        <input type="number" id="eta" placeholder="18">
      </div>
    </div>

    <button onclick="aggiungiRiga()">Aggiungi alla Tabella</button>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Indirizzo</th>
            <th>Città</th>
            <th>Età</th>
          </tr>
        </thead>
        <tbody id="corpoTabella">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function aggiungiRiga() {
      let nome = document.getElementById('nome').value;
      let cognome = document.getElementById('cognome').value;
      let indirizzo = document.getElementById('indirizzo').value;
      let citta = document.getElementById('citta').value;
      let eta = document.getElementById('eta').value;

      if (!nome && !cognome && !indirizzo && !citta && !eta) {
        return;
      }

      let td1 = document.createElement('td');
      td1.textContent = nome;

      let td2 = document.createElement('td');
      td2.textContent = cognome;

      let td3 = document.createElement('td');
      td3.textContent = indirizzo;

      let td4 = document.createElement('td');
      td4.textContent = citta;

      let td5 = document.createElement('td');
      td5.textContent = eta;

      let tr = document.createElement('tr');
      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      tr.appendChild(td4);
      tr.appendChild(td5);

      document.getElementById('corpoTabella').appendChild(tr);

      document.getElementById('nome').value = '';
      document.getElementById('cognome').value = '';
      document.getElementById('indirizzo').value = '';
      document.getElementById('citta').value = '';
      document.getElementById('eta').value = '';
    }
  </script>

</body>
</html>
