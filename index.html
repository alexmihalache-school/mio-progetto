<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciao sono Alex</title>
  <!-- Importazione di un font elegante da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Reset di base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Definizione dei colori */
    :root {
      --bg-color: #0b0b0b;          /* Nero profondo */
      --card-bg: #141414;           /* Nero/Grigio molto scuro per contrasto */
      --primary-red: #8b0016;       /* Rosso scuro elegante */
      --accent-red: #a3122b;        /* Rosso leggermente più luminoso per sfumature/hover */
      --text-white: #f5f5f5;        /* Bianco morbido */
      --text-muted: #a0a0a0;        /* Grigio chiaro per dettagli */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Effetto sfocato di sfondo in rosso scuro */
    .glow-background {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--primary-red) 0%, rgba(0,0,0,0) 70%);
      opacity: 0.25;
      filter: blur(80px);
      z-index: 1;
      border-radius: 50%;
    }

    /* Card principale */
    .card {
      position: relative;
      z-index: 2;
      background-color: var(--card-bg);
      padding: 3rem 4rem;
      border-radius: 16px;
      border: 1px solid rgba(139, 0, 22, 0.4); /* Bordo sottile rosso scuro */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8),
                  0 0 20px rgba(139, 0, 22, 0.15);
      text-align: center;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9),
                  0 0 25px rgba(163, 18, 43, 0.25);
    }

    /* Sottotitolo/Accetto sopra */
    .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--accent-red);
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    /* Titolo Principale */
    h1 {
      font-family: 'Cinzel', serif; /* Font elegante e classico */
      font-size: 3rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    /* Dettaglio stilistico (linea rossa elegante) */
    .divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Bagliore soft di sfondo -->
  <div class="glow-background"></div>

  <!-- Contenitore centrale -->
  <div class="card">
    <p class="subtitle">Benvenuto</p>
    <h1>Ciao, sono Alex</h1>
    <div class="divider"></div>
  </div>

</body>
</html>
