<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex $</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #fff;
      --fg: #000;
      --line: #e5e5e5;
    }

    body.dark {
      --bg: #000;
      --fg: #fff;
      --line: #292929;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1600px;
      margin: auto;
      padding: 32px 6%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    button {
      color: var(--fg);
      background: none;
      border: 1px solid var(--line);
      padding: 10px 15px;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: var(--fg);
      color: var(--bg);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 0;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(68px, 13.5vw, 190px);
      font-weight: 800;
      letter-spacing: -0.095em;
      line-height: .82;
    }

    h1 span {
      display: block;
      margin-top: 15px;
    }

    .bottom {
      margin-top: 48px;
      width: 100%;
      max-width: 430px;
    }

    .line {
      height: 1px;
      width: 100%;
      background: var(--line);
      margin-bottom: 20px;
    }

    .description {
      font-size: 13px;
      line-height: 1.8;
      max-width: 290px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 18px;
      font-size: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 24px 7%;
      }

      h1 {
        font-size: clamp(64px, 15vw, 100px);
      }

      main {
        padding: 70px 0;
      }

      .bottom {
        margin-top: 35px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="logo">A.</div>
      <button id="theme">DARK MODE</button>
    </header>

    <main>
      <p class="eyebrow">PERSONAL PAGE — 2026</p>

      <h1>
        Ciao,
        <span>sono Alex.</span>
      </h1>

      <div class="bottom">
        <div class="line"></div>
        <p class="description">
          Uno spazio personale.<br>
          Nient'altro.
        </p>
      </div>
    </main>

    <footer>
      <span>ALEX.</span>
      <span>LESS, BUT BETTER.</span>
    </footer>
  </div>

  <script>
    const btn = document.getElementById("theme");

    btn.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      btn.textContent = document.body.classList.contains("dark")
        ? "LIGHT MODE"
        : "DARK MODE";
    });
  </script>
</body>
</html>
