<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Alex.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1600px;
      margin: 0 auto;
      padding: 32px 7%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .edition {
      font-size: 10px;
      color: #777;
      letter-spacing: 2px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 90px 0;
    }

    .label {
      font-size: 10px;
      color: #888;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(68px, 13vw, 180px);
      font-weight: 700;
      letter-spacing: -0.09em;
      line-height: 0.88;
    }

    h1 span {
      display: block;
      margin-top: 12px;
    }

    .outline {
      color: transparent;
      -webkit-text-stroke: 1px #fff;
    }

    .details {
      margin-top: 60px;
      max-width: 360px;
    }

    .line {
      width: 100%;
      height: 1px;
      background: #292929;
      margin-bottom: 22px;
    }

    .description {
      font-size: 13px;
      color: #888;
      line-height: 1.9;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid #222;
      color: #777;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 7%;
      }

      .edition {
        font-size: 9px;
      }

      h1 {
        font-size: clamp(64px, 14vw, 95px);
      }

      main {
        padding: 70px 0;
      }

      .details {
        margin-top: 45px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      main {
        animation: reveal 1s ease both;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="logo">A.</div>
      <div class="edition">PERSONAL SPACE / 001</div>
    </header>

    <main>
      <p class="label">BENVENUTO NEL MIO MONDO</p>

      <h1>
        Ciao,
        <span class="outline">sono Alex.</span>
      </h1>

      <div class="details">
        <div class="line"></div>
        <p class="description">
          Poche parole.<br>
          Idee chiare.<br>
          Essenziale, sempre.
        </p>
      </div>
    </main>

    <footer>
      <span>© ALEX 2026</span>
      <span>LESS IS MORE.</span>
    </footer>
  </div>
</body>
</html>
