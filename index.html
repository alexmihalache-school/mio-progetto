
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciao, sono Alex</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --text: #111111;
      --secondary: #666666;
      --border: #e5e5e5;
      --button-bg: #111111;
      --button-text: #ffffff;
    }

    body.dark {
      --bg: #000000;
      --text: #ffffff;
      --secondary: #aaaaaa;
      --border: #292929;
      --button-bg: #ffffff;
      --button-text: #000000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 8%;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .theme-button {
      padding: 10px 16px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .theme-button:hover {
      background: var(--text);
      color: var(--bg);
    }

    main {
      min-height: calc(100vh - 145px);
      min-height: calc(100dvh - 145px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 80px 12%;
    }

    .subtitle {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--secondary);
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(52px, 10vw, 120px);
      line-height: 0.95;
      letter-spacing: -0.08em;
      font-weight: 800;
    }

    h1 span {
      display: block;
      margin-top: 12px;
      -webkit-text-stroke: 1.5px var(--text);
      color: transparent;
    }

    .description {
      max-width: 390px;
      margin-top: 30px;
      color: var(--secondary);
      font-size: 16px;
      line-height: 1.8;
    }

    .line {
      width: 55px;
      height: 2px;
      background: var(--text);
      margin-top: 35px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 22px 8%;
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 6%;
      }

      main {
        padding: 70px 8%;
      }

      h1 {
        font-size: clamp(52px, 13vw, 78px);
      }

      .description {
        font-size: 14px;
      }

      footer {
        padding: 20px 6%;
        gap: 12px;
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">ALEX.</div>
    <button class="theme-button" id="themeToggle">
      Tema scuro
    </button>
  </header>

  <main>
    <p class="subtitle">Benvenuto nel mio spazio</p>

    <h1>
      Ciao, sono
      <span>Alex.</span>
    </h1>

    <p class="description">
      Semplicità, creatività e attenzione ai dettagli.
      Questo è il mio spazio, essenziale proprio come piace a me.
    </p>

    <div class="line"></div>
  </main>

  <footer>
    <span>© 2026 Alex</span>
    <span>MINIMAL DESIGN</span>
  </footer>

  <script>
    const button = document.getElementById("themeToggle");

    button.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      button.textContent =
        document.body.classList.contains("dark")
          ? "Tema chiaro"
          : "Tema scuro";
    });
  </script>
</body>
</html>
