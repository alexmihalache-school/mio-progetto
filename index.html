
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Ciao Alex 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #d9c8ff);
      font-family: 'Arial', sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px #0002;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      color: #ff69a6;
      font-size: 32px;
    }

    p {
      color: #888;
    }

    @keyframes float {
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 Ciao sono Alex 💖</h1>
    <p>Benvenuto nel mio piccolo mondo ✨</p>
  </div>
</body>
</html>
