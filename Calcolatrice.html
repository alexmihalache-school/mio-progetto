<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatrice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid #2c2c2c;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaaaaa;
      font-weight: 600;
    }

    .input-group input {
      background-color: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #666666;
    }

    .input-group input::placeholder {
      color: #666666;
    }

    .buttons-row {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .buttons-row button {
      flex: 1;
      padding: 14px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .buttons-row button:hover {
      background-color: #e0e0e0;
    }

    .buttons-row button:active {
      transform: scale(0.97);
    }

    .result-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaaaaa;
      font-weight: 600;
    }

    .result-group input {
      background-color: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      width: 100%;
    }

    .result-group input::placeholder {
      color: #666666;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calcolatrice 1.0</h1>

    <div class="grid">
      <div class="input-group">
        <label for="num1">Primo numero</label>
        <input type="text" id="num1">
      </div>
      <div class="input-group">
        <label for="num2">Secondo numero</label>
        <input type="text" id="num2">
      </div>
    </div>

    <div class="buttons-row">
      <button onclick="calcola('+')">+</button>
      <button onclick="calcola('-')">-</button>
      <button onclick="calcola('*')">*</button>
      <button onclick="calcola('/')">/</button>
    </div>

    <div class="result-group">
      <label for="result">Risultato</label>
      <input type="text" id="result">
    </div>
  </div>

  <script>
    function calcola(op) {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const risultato = document.getElementById('result');

      if (op == '+') {
        risultato.value = num1 + num2;
      } else if (op == '-') {
        risultato.value = num1 - num2;
      } else if (op == '*') {
        risultato.value = num1 * num2;
      } else if (op == '/') {
        if (num2 == 0) return risultato.value = "Impossibile";
        risultato.value = num1 / num2;
      }
    }
  </script>

</body>
</html>
