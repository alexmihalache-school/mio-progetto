<!DOCTYPE html>
<head>
  <title>Calcolatrice</title>
</head>
<body>

  <div>
    <input type="text" id="num1">
  </div>

  <div>
    <input type="text" id="num2">
  </div>

  <div>
    <button onclick="calcola('+')">+</button>
    <button onclick="calcola('-')">-</button>
    <button onclick="calcola('*')">*</button>
    <button onclick="calcola('/')">/</button>
  </div>

  <div>
    <input type="text" id="result" readonly>
  </div>

  <script>
    function calcola(op) {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const campoRisultato = document.getElementById('result');

      let calcolo = 0;

      if (op == '+') {
        calcolo = num1 + num2;
      } else if (op == '-') {
        calcolo = num1 - num2;
      } else if (op == '*') {
        calcolo = num1 * num2;
      } else if (op == '/') {
        if (num2 == 0) return campoRisultato.value = "Errore";
        calcolo = num1 / num2;
      }
      campoRisultato.value = calcolo;
    }
  </script>

</body>
</html>
