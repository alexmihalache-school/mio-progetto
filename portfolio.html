<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
            background-color: #050505;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .logo span {
            color: #a00000;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.8rem;
            color: #888;
        }

        .btn-dashboard {
            background-color: #222;
            color: #fff;
            padding: 8px 15px;
            border: 1px solid #444;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: background 0.3s;
        }

        .btn-dashboard:hover {
            background-color: #333;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            text-align: center;
            color: #888;
            max-width: 600px;
            margin-bottom: 50px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .projects-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .project-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .project-btn:hover {
            border-color: #a00000;
            background-color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(160, 0, 0, 0.2);
        }

        .project-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #a00000;
            transition: width 0.3s ease;
        }

        .project-btn:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            header { padding: 15px 20px; }
            .header-right { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IL MIO SITO<span>.</span></div>
        <div class="header-right">
            <span>Stato Utente</span>
            <a href="#" class="btn-dashboard">Dashboard</a>
        </div>
    </header>

    <main>
        <h1>Mario Rossi</h1>
        
        <p class="subtitle">
            Benvenuto nel mio spazio personale. Seleziona uno dei progetti qui sotto per visualizzare i dettagli.
        </p>

        <div class="projects-container">
            <button class="project-btn" onclick="apriProgetto('https://alexmihalache-school.github.io/mio-progetto/Anagrafica.html')">
                Progetto 1
            </button>

            <button class="project-btn" onclick="apriProgetto('https://alexmihalache-school.github.io/mio-progetto/Calcolatrice.html')">
                Progetto 2
            </button>

            <button class="project-btn" onclick="apriProgetto('https://github.com/tuonome/progetto3')">
                Progetto 3
            </button>

            <button class="project-btn" onclick="apriProgetto('https://github.com/tuonome/progetto4')">
                Progetto 4
            </button>
        </div>
    </main>

    <script>
        function apriProgetto(linkGitHub) {
            window.location.href = linkGitHub;
        }
    </script>
</body>
</html>
