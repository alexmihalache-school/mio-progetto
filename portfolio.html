<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Sfondo con alone rosso scuro in alto, come nell'immagine */
            background: radial-gradient(circle at 50% 0%, #2a0505 0%, #0a0a0a 60%);
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #1a1a1a;
            background-color: transparent;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .logo span {
            color: #a00000;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Allinea in alto invece che al centro */
            padding: 60px 20px 40px 20px;
            width: 100%;
        }

        .top-label {
            font-family: 'Montserrat', sans-serif;
            color: #a00000;
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 400;
            text-align: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 0%, #777777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .subtitle {
            text-align: center;
            color: #888;
            max-width: 600px;
            margin-bottom: 70px;
            line-height: 1.6;
            font-size: 0.9rem;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-align: center;
        }

        .section-divider {
            width: 50px;
            height: 2px;
            background-color: #a00000;
            margin: 0 auto 40px auto;
        }

        .projects-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .project-btn {
            display: block;
            width: 100%;
            padding: 25px 20px;
            background-color: #0d0d0d; /* Sfondo scuro della card */
            border: 1px solid #222;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            text-align: left; /* Allineamento a sinistra come nelle card */
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .project-btn:hover {
            border-color: #a00000;
            background-color: #151515;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(160, 0, 0, 0.15);
        }

        .project-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #a00000;
            transition: width 0.3s ease;
        }

        .project-btn:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            header { padding: 15px 20px; }
            .section-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ITT Cannizzaro Rho<span>.</span></div>
    </header>

    <main>
        <div class="top-label">Portfolio & Showcase Progetti</div>

        <h1>Alexandru Ricardo Mihalache</h1>
        
        <p class="subtitle">
            Benvenuto nel luogo dove raccolgo e condivido il mio lavoro. Dai un'occhiata ai progetti per vedere cosa realizzo.
        </p>

        <h2 class="section-title">I Miei Lavori</h2>
        <div class="section-divider"></div>

        <div class="projects-container">
            <button class="project-btn" onclick="apriProgetto('https://alexmihalache-school.github.io/mio-progetto/Anagrafica.html')">
                Anagrafica 1.0
            </button>

            <button class="project-btn" onclick="apriProgetto('https://alexmihalache-school.github.io/mio-progetto/Calcolatrice.html')">
                Calcolatrice 1.0
            </button>
        </div>
    </main>

    <script>
        function apriProgetto(linkGitHub) {
            window.open(linkGitHub, '_blank');
        }
    </script>
</body>
</html>
