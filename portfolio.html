<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
            background-color: #050505;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .logo span {
            color: #a00000;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* NUOVO STILE PER LA SCRITTA SOPRA IL TITOLO */
        .top-label {
            font-family: 'Montserrat', sans-serif;
            color: #a00000;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 400;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            text-align: center;
            color: #888;
            max-width: 600px;
            margin-bottom: 60px; /* Aumentato per fare spazio alla nuova scritta */
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* NUOVO STILE PER "I MIEI LAVORI" */
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* LINEA ROSSA DECORATIVA */
        .section-divider {
            width: 60px;
            height: 2px;
            background-color: #a00000;
            margin: 0 auto 50px auto; /* Centrata e con spazio sotto */
        }

        .projects-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .project-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .project-btn:hover {
            border-color: #a00000;
            background-color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(160, 0, 0, 0.2);
        }

        .project-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #a00000;
            transition: width 0.3s ease;
        }

        .project-btn:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            header { padding: 15px 20px; }
            .section-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ITT Cannizzaro Rho<span>.</span></div>
    </header>

    <main>
        <!-- SCRITTA AGGIUNTA SOPRA IL NOME -->
        <div class="top-label">Portfolio & Showcase Progetti</div>

        <h1>Alexandru Ricardo Mihalache</h1>
        
        <p class="subtitle">
            Benvenuto nel luogo dove raccolgo e condivido il mio lavoro. Dai un'occhiata ai progetti per vedere cosa realizzo.
        </p>

        <!-- SCRITTA AGGIUNTA SOPRA I PULSANTI -->
        <h2 class="section-title">I Miei Lavori</h2>
        <div class="section-divider"></div>

        <div class="projects-container">
            <button class="project-btn" onclick="apriProgetto('https://alexmihalache-school.github.io/mio-progetto/Anagrafica.html')">
                Anagrafica 1.0
            </button>

            <!-- Corretta la chiusura del tag button che mancava nel file originale -->
            <button class="project-btn" onclick="apriProgetto('https://alexmihalache-school.github.io/mio-progetto/Calcolatrice.html')">
                Calcolatrice 1.0
            </button>
        </div>
    </main>

    <script>
        function apriProgetto(linkGitHub) {
            window.open(linkGitHub, '_blank');
        }
    </script>
</body>
</html>
