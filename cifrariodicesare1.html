<!DOCTYPE html>
<html>
<head>
    <script>
        function cripta() {
            var parola = document.getElementById("testo1").value;
            var spostamento = parseFloat(document.getElementById("numero").value);
            var lunghezza = parola.length;
            var criptata = "";
            for (let i = 0; i < parola.length; i++) {
                var lettera = String.fromCharCode(parola.charCodeAt(i) + spostamento);
                criptata = criptata + lettera;
            }
            document.getElementById("criptata").innerHTML = criptata;
        }
    </script>
</head>
<body>
    <h1>Criptare la parola</h1>
    <h4>Inserisci il testo e il numero con cui criptare la parola</h4>
    <input type="text" id="testo1" placeholder="Testo da criptare...">
    <input type="number" id="numero" placeholder="Valore di spostamento...">
    <button onclick="cripta()">Cripta</button>
    <p>messaggio criptato:</p>
    <p id="criptata"></p>
    <a href="https://alexmihalache-school.github.io/mio-progetto/cifrariodicesare2.html"> Decripta la parola</a>
</body>
</html>
