<!DOCTYPE html>
<html>
<head>
    <title>Cripta Frase</title>
</head>
<body>

    <h2>Cripta la frase</h2>

    <p>Frase da criptare:</p>
    <input type="text" id="frase">

    <p>Numero di scostamento:</p>
    <input type="number" id="numero" value="3">

    <br><br>
    <button onclick="cripta()">Cripta</button>

    <p>Frase criptata: <b id="risultato"></b></p>

    <a href="decripta.html">Vai a decriptare</a>

    <script>
        function cripta() {
            let alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let testo = document.getElementById("frase").value.toUpperCase();
            let spostamento = parseInt(document.getElementById("numero").value);
            let fraseCriptata = "";

            for (let i = 0; i < testo.length; i++) {
                let lettera = testo[i];
                let posizione = alfabeto.indexOf(lettera);

                if (posizione == -1) {
                    fraseCriptata += lettera;
                } else {
                    let nuovaPosizione = (posizione + spostamento) % 26;
                    fraseCriptata += alfabeto[nuovaPosizione];
                }
            }

            document.getElementById("risultato").innerHTML = fraseCriptata;
            
            localStorage.setItem("messaggio", fraseCriptata);
        }
    </script>

</body>
</html>
