<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #2c2c2c;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        h4 {
            font-size: 13px;
            font-weight: 400;
            color: #9e9e9e;
            margin-bottom: 26px;
        }

        .row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: #9e9e9e;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            background-color: #2b2b2b;
            border: 1px solid #444444;
            border-radius: 6px;
            color: #ffffff;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #888888;
        }

        button {
            width: 100%;
            background-color: #ffffff;
            color: #121212;
            border: none;
            border-radius: 6px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 22px;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        .label-risultato {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: #9e9e9e;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #criptata {
            background-color: #2b2b2b;
            border: 1px solid #444444;
            border-radius: 6px;
            padding: 12px 14px;
            min-height: 44px;
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 20px;
            word-break: break-all;
        }

        a {
            display: inline-block;
            color: #9e9e9e;
            font-size: 13px;
            text-decoration: none;
        }

        a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
    <script>
        function cripta() {
            var parola = document.getElementById("text").value;
            var spostamento = parseFloat(document.getElementById("number").value);
            var lunghezza = parola.length;
            var criptata = "";
            for (let i = 0; i < parola.length; i++) {
                var lettera = String.fromCharCode(parola.charCodeAt(i) + spostamento);
                criptata = criptata + lettera;
            }
            document.getElementById("criptata").innerHTML = criptata;
        }
    </script>
</head>
<body>
    <div class="card">
        <h1>Cifrario di Cesare</h1>
        <h4>Inserisci il testo e il numero per criptare una parola</h4>

        <div class="row">
            <div class="field">
                <label for="text">Testo</label>
                <input type="text" id="text">
            </div>
            <div class="field">
                <label for="number">Scostamento</label>
                <input type="number" id="number">
            </div>
        </div>

        <button onclick="cripta()">Cripta</button>

        <p class="label-risultato">Testo criptato:</p>
        <p id="criptata"></p>

        <a href="https://alexmihalache-school.github.io/mio-progetto/cifrariodicesare2.html"> Decripta il testo</a>
    </div>
</body>
</html>
